<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Zen Garden Design Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Mono', monospace;
      color: #111111;
    }

    .zg-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: #111111;
    }

    .zg-header p {
      font-size: 12px;
      color: #888888;
      letter-spacing: 0.04em;
    }

    .zg-card {
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .zg-card:hover {
      border-color: rgba(0,0,0,0.4);
    }

    .zg-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #f5f5f5;
      overflow: hidden;
    }

    .zg-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .zg-thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #aaaaaa;
      letter-spacing: 0.08em;
    }

    .zg-title {
      font-family: 'DM Serif Display', serif;
      font-size: 16px;
      font-weight: 400;
      color: #111111;
    }

    .zg-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.03em;
    }

    .zg-explanation {
      font-size: 12px;
      line-height: 1.6;
      color: #555555;
      border-top: 1px solid rgba(0,0,0,0.1);
      padding-top: 8px;
      display: none;
    }

    .zg-explanation.visible {
      display: block;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="zg-header mb-4">
    <h2 class="mb-1">CSS Zen Garden</h2>
    <p class="mb-0">same html &middot; different css &middot; infinite designs</p>
  </div>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="zg-grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const designs = [
    { id: 221, name: "Mid Century Modern", author: "Andrew Lohman", tags: ["geometric", "warm palette", "retro"], description: "Clean geometric shapes and a warm earth-tone palette inspired by 1950s American design. Bold sans-serif typography, structured layouts, and a sense of order with decorative flair." },
    { id: 220, name: "Garments", author: "Dan Mall", tags: ["editorial", "fashion", "typographic"], description: "Editorial fashion-magazine aesthetic. Typography is the hero — oversized display text, stark contrast, and refined whitespace create a high-fashion feel without a single image." },
    { id: 219, name: "Steel", author: "Steffen Knoeller", tags: ["industrial", "dark", "metallic"], description: "Raw industrial aesthetic with a dark, metallic palette. Simulates riveted steel surfaces and brushed metal textures using only CSS gradients — no images required." },
    { id: 218, name: "Apothecary", author: "Trent Walton", tags: ["vintage", "serif-heavy", "earthy"], description: "Victorian apothecary shop aesthetic. Dense serif typography, aged parchment tones, and ornamental rules and dividers evoke hand-typeset pharmaceutical labels from the 1800s." },
    { id: 217, name: "Screen Filler", author: "Elliot Jay Stocks", tags: ["bold", "full-bleed", "modern"], description: "Every element stretches edge-to-edge. Typography at huge scale fills the viewport deliberately. Contrast and spatial tension replace decorative detail." },
    { id: 216, name: "Fountain Kiss", author: "Jeremy Carlson", tags: ["romantic", "painterly", "flowing"], description: "Organic, flowing shapes and a romantic soft-focus palette. Curved containers and painterly background elements make the layout feel hand-crafted rather than constructed." },
    { id: 215, name: "A Robot Named Jimmy", author: "meltmedia", tags: ["playful", "illustrated", "quirky"], description: "Full illustrated character art integrated into the layout. The CSS positions and animates a custom robot illustration around the text, blurring the line between graphic design and web design." },
    { id: 214, name: "Verde Moderna", author: "Dave Shea", tags: ["elegant", "green", "art nouveau"], description: "Dave Shea's own submission. Art Nouveau ornamental borders and a deep forest-green palette. Decorative floral motifs built from CSS-positioned background images frame the content with gallery-worthy elegance." },
    { id: 213, name: "Under the Sea!", author: "Eric Stoltz", tags: ["aquatic", "illustrated", "layered"], description: "Richly illustrated underwater scene layered behind and around the text. Multiple z-index layers of coral, fish, and bubbles create parallax depth — all controlled by CSS positioning." },
    { id: 212, name: "Make 'em Proud", author: "McAghon & Reifsnyder", tags: ["americana", "bold", "athletic"], description: "Bold American sports-team aesthetic. Block typography, strong diagonal accents, and a high-contrast red-white-blue palette give it the energy of a stadium scoreboard or vintage pennant." },
    { id: 211, name: "Orchid Beauty", author: "Kevin Addison", tags: ["floral", "soft", "feminine"], description: "Delicate orchid motifs and a soft pink-lavender palette. Floating petals and curved section backgrounds are pure CSS — the layout breathes and the decoration feels woven into the structure." },
    { id: 210, name: "Oceanscape", author: "Justin Gray", tags: ["panoramic", "blue", "atmospheric"], description: "A wide, cinematic ocean horizon stretches across the top. Cool blue gradients and generous whitespace make it feel like staring out to sea — calm, spacious, and unhurried." },
    { id: 209, name: "CSS Co., Ltd.", author: "Benjamin Klemm", tags: ["corporate", "japanese", "structured"], description: "Japanese corporate design language — clean grid structure, kanji-style logotype, formal hierarchy, and a restrained monochromatic palette. Looks like a multinational annual report." },
    { id: 208, name: "Sakura", author: "Tatsuya Uchida", tags: ["japanese", "minimalist", "spring"], description: "Deeply Japanese — falling cherry blossoms, soft ink-wash tones, and haiku-like negative space. Minimalism here is cultural rather than trendy, referencing wabi-sabi and seasonal impermanence." },
    { id: 207, name: "Kyoto Forest", author: "John Politowski", tags: ["lush", "vertical", "nature"], description: "Tall bamboo grove imagery and vertical rhythms dominate. The layout scrolls like a hanging scroll painting; deep greens and vertical text spacing reinforce the forest immersion." },
    { id: 206, name: "A Walk in the Garden", author: "Simon Van Hauwermeiren", tags: ["illustrated", "storybook", "green"], description: "A hand-illustrated garden stroll. Whimsical plant and path illustrations border the content, giving it the feel of a children's book illustration rather than a web page." },
    { id: 205, name: "spring360", author: "Rene Hornig", tags: ["circular", "radial", "experimental"], description: "Radial layout instead of a vertical stack — elements orbit a central point. Breaking the top-to-bottom reading convention entirely is the core CSS statement here." },
    { id: 204, name: "Withering Beauty", author: "William Duffy", tags: ["dark", "gothic", "decay"], description: "Gothic decay aesthetic. Dark backgrounds, aged textures, and wilting botanical motifs create a memento mori mood. The typography is deliberately distressed and fragile-feeling." },
  ];

  function renderCards() {
    const grid = document.getElementById('zg-grid');
    grid.innerHTML = designs.map(d => `
      <div class="col">
        <div class="card h-100 zg-card" id="card-${d.id}">
          <div class="zg-thumb">
            <img src="https://csszengarden.com/content/previews/${d.id}.png" alt="${d.name} design preview"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="zg-thumb-placeholder" style="display:none;">${d.id}</div>
          </div>
          <div class="card-body d-flex flex-column gap-2">
            <p class="card-title zg-title mb-0">${d.name}</p>
            <p class="text-muted mb-0" style="font-size:11px;">by ${d.author}</p>
            <div class="d-flex flex-wrap gap-1">
              ${d.tags.map(t => `<span class="badge rounded-pill text-bg-secondary">${t}</span>`).join('')}
            </div>
            <button class="btn btn-outline-secondary btn-sm mt-auto zg-btn" onclick="explain(${d.id})">&nearr; what makes this unique?</button>
            <div class="zg-explanation mt-1" id="exp-${d.id}"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function explain(id) {
    const design = designs.find(d => d.id === id);
    const btn = document.querySelector(`#card-${id} .zg-btn`);
    const expDiv = document.getElementById(`exp-${id}`);

    if (expDiv.classList.contains('visible')) {
      expDiv.classList.remove('visible');
      btn.innerHTML = '&nearr; what makes this unique?';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'thinking...';

    const otherDesigns = designs.filter(d => d.id !== id).map(d => `- ${d.name}: ${d.tags.join(', ')}`).join('\n');

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `You are an expert CSS and web design historian explaining CSS Zen Garden designs.

The design is: "${design.name}" by ${design.author}
Its character: ${design.description}
Tags: ${design.tags.join(', ')}

The other 17 designs in this set are:
${otherDesigns}

Write 2-3 sentences explaining what makes "${design.name}" distinctly different from all the others. Focus on its unique CSS technique, aesthetic philosophy, or cultural inspiration. Be specific and interesting. Do not use bullet points. Plain prose only.`
          }]
        })
      });
      const data = await resp.json();
      const text = data.content?.find(b => b.type === 'text')?.text || design.description;
      expDiv.textContent = text;
      expDiv.classList.add('visible');
      btn.innerHTML = '&uarr; hide';
    } catch (e) {
      expDiv.textContent = design.description;
      expDiv.classList.add('visible');
      btn.innerHTML = '&uarr; hide';
    }

    btn.disabled = false;
  }

  renderCards();
</script>

</body>
</html>
