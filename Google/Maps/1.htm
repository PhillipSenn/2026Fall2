<!DOCTYPE html>
<html>
<head>
  <title>Dulles Airport Map - Advanced Marker</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Full-page map */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* Custom marker styling */
    .airport-marker {
      background: #1a73e8;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border: 2px solid white;
      white-space: nowrap;
    }
  </style>

  <script src="google-maps.js"></script>

  <script>
    async function initMap() {
      const dulles = { lat: 38.9531, lng: -77.4565 };

      // Import required libraries
      const { Map } = await google.maps.importLibrary("maps");
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      // Create map
      const map = new Map(document.getElementById("map"), {
        zoom: 14,
        center: dulles,
        mapId: "YOUR_MAP_ID",
      });

      // Create custom marker content
      const markerContent = document.createElement("div");
      markerContent.className = "airport-marker";
      markerContent.textContent = "IAD – Dulles Airport";

      // Add Advanced Marker
      new AdvancedMarkerElement({
        map,
        position: dulles,
        content: markerContent,
        title: "Washington Dulles International Airport (IAD)"
      });
    }

    window.initMap = initMap;
  </script>
</head>

<body onload="initMap()">
  <div id="map"></div>
</body>
</html>
